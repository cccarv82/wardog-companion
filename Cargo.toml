[package]
name = "wardog-companion"
version = "1.0.1"
edition = "2024"
description = "A focused, offline weapon-build companion in Rust"
license = "MIT"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "thread-pool"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[target.'cfg(windows)'.dependencies]
global-hotkey = "0.9"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
lto = "thin"
strip = true
